[project]
name = "smint"
version = "2.0.0"
description = "SMINT - Spatial Multi-Omics Integration Toolkit"
readme = "README.md"
requires-python = ">=3.10"
# Table form rather than the PEP 639 string form: the string form requires
# setuptools>=77, which excludes environments such as STalign_env (75.1.0).
license = {text = "MIT"}
authors = [
    {name = "Jurgen Kriel"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "cellpose>=3",
    "dask>=2024.11.2",
    "email-validator>=2.2.0",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "matplotlib>=3.10.3",
    "numpy>=1.24",  # not >=2: STalign worker environments need numpy<2
    "opencv-python",
    "pandas>=2.2.3",
    "psycopg2-binary>=2.9.10",
    "pyyaml>=6.0",  # smint.utils.config
    "scikit-image>=0.25.2",
    "setuptools>=80.4.0",
    "shapely>=2.0",  # smint.segmentation.stitching, imported by smint.segmentation
    "tifffile>=2025.5.10",
]

[project.urls]
Homepage = "https://github.com/JurgenKriel/SMINT"
Documentation = "https://jurgenkriel.github.io/SMINT/"

[project.scripts]
smint-alignment = "smint.cli.align:main"
smint-register = "smint.cli.register:main"
smint-segment-distributed = "smint.segmentation.distributed_seg:main"
smint-viewer = "smint.visualization.live_scan_viewer:main"

# Registration worker, invoked by smint.alignment.jobs in a separate process.
[project.entry-points."napari.manifest"]
smint = "smint.napari:napari.yaml"

[project.optional-dependencies]
r_integration = ["rpy2>=3.4.0"]
segmentation = ["cellpose>=3"]
distributed = ["distributed>=2024.8.0", "dask-jobqueue>=0.8", "zarr>=2.18", "shapely>=2.0"]
visualization = ["matplotlib>=3.10.3"]
gui = []
docs = ["mkdocs", "mkdocs-material"]
dev = ["pytest", "flake8", "black"]
all = ["distributed>=2024.8.0", "dask-jobqueue>=0.8", "zarr>=2.18", "shapely>=2.0", "rpy2>=3.4.0", "mkdocs", "mkdocs-material", "pytest", "flake8", "black"]

# Discover subpackages (smint.alignment, smint.segmentation, ...) rather than
# declaring only the top-level `smint`, which left them out of the install.
[tool.setuptools.packages.find]
include = ["smint*"]

[tool.setuptools.package-data]
smint = ["**/*"]
# napari discovers the plugin through this manifest, so it must ship.
"smint.napari" = ["napari.yaml"]
